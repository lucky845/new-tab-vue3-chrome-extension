settings_engine_add: 添加
settings_engine_icon_details: 新引擎的图标（可选）
settings_engine_empty: 暂无自定义引擎
settings_engine_favicon: 用站点 favicon 当图标
settings_engine_site_icon: 站点图标
settings_engine_pick_image: 选一张图当图标
settings_engine_change_image: 换图
settings_engine_choose_image: 选图
settings_engine_clear_icon: 清空图标，退回站点 favicon 或首字
settings_engine_clear: 清空
settings_engine_delete: 删除
settings_engine_delete_aria: 删除引擎
settings_engine_placeholder_desc: 搜索链接中用 %s 代表关键词占位符，添加后可在搜索框下拉中选择。自定义引擎可以拖图取景，不设置时先用站点 favicon，抓不到再用名称首字；内置引擎固定用品牌图标。
settings_engine_builtin: 内置引擎
settings_weather_city: 天气城市
settings_weather_city_placeholder: "例如: 北京, 上海, 广州"
settings_weather_city_desc: 留空将自动使用您的位置，或手动输入城市名称。
settings_tagline: 首页标语
settings_tagline_placeholder: 例如：今天也要好好写代码
settings_tagline_desc: 显示在时钟下方，留空则隐藏。
settings_wallpaper_brightness: 壁纸亮度
settings_wallpaper_blur: 壁纸模糊
settings_wallpaper_adjust_desc: 调整壁纸观感，文字更易读。修改后立即生效并自动保存。
settings_wallpaper_source: 壁纸图源
settings_source_picsum: Picsum 精选（默认）
settings_source_picsum_desc: 国内直连稳定可达，Unsplash 精选摄影图，无需任何密钥。仅支持按页浏览，不支持按分类 / 关键词筛选；点分类时会自动尝试 Wallhaven，连不上则退化为浏览模式并给出提示。
settings_source_wallhaven: Wallhaven（支持分类与关键词）
settings_source_wallhaven_desc: 唯一支持按分类 / 关键词真正筛选的图源，壁纸质量高；需要能访问境外网络（wallhaven.cc 国内直连不稳定）。想用分类筛选请选这个。
settings_wallpaper_source_hint: 切换后重新打开壁纸库生效；启动壁纸与「换一张」也会使用所选图源。
settings_theme_label: 外观主题
settings_theme_light: 浅色
settings_theme_light_desc: 始终保持原样：白字浮在壁纸上
settings_theme_dark: 深色
settings_theme_dark_desc: 在原样式基础上压暗壁纸
settings_theme_system: 跟随系统
settings_theme_system_desc: 按操作系统的浅色/深色偏好切换
settings_theme_sun: 日出日落
settings_theme_sun_desc: 白天浅色、夜晚深色
settings_theme_light_start: 白天开始
settings_theme_motion_preview: 已改为预览态，停手 3 秒自动保存
settings_sun_desc: 日出日落会自动读取当地日出/日落时刻；拿不到定位或网络时，改用上面的自定义时段。
settings_motion: 动效
settings_reduce_motion: 减少动效
settings_reduce_motion_desc: 关闭面板过渡、悬浮位移等动画，降低视觉干扰与重绘开销；系统开启「减少动态效果」时会自动降级，无需打开此开关
settings_widgets: 小组件显示
settings_widgets_home: 主页显示小组件
settings_widgets_desc: 待办 / 便签 / 番茄钟常驻两侧；关闭后可随时点右上角按钮打开对应面板
settings_side_card_desc: 四张卡片默认展示，可按需改为「有内容时出现」或「隐藏」；关掉后中间内容会自动收回让出的宽度。
settings_language: 界面语言
settings_pexels_placeholder: 在此输入您的密钥
settings_pexels_desc_part1: 可选增强功能：填写后壁纸搜索与分类筛选一律走 Pexels（优先级高于下方「壁纸图源」选择）。不填也完全可用——默认使用 Picsum 免费图库，无需任何密钥，但 Picsum 不支持分类筛选。
settings_get_free_key: 获取免费密钥
settings_amap_key: 高德地图 Web服务 Key（可选增强）
settings_amap_placeholder: 在此输入您的高德Web服务Key
settings_amap_desc: 可选：不填时天气功能自动使用 Open-Meteo 免费数据，无需任何密钥。如需高德数据，前往 高德开放平台 申请 Web服务 Key。
