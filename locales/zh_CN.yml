settings_tab_wallpaper: 壁纸
settings_tab_theme: 主题
settings_tab_home: 主页
settings_tab_advanced: 高级
settings_language_auto: 跟随浏览器
settings_language_desc: 切换后立即生效，会记住选择。选「跟随浏览器」时按系统界面语言自动匹配。
settings_title: 设置
settings_close: 关闭
settings_autosave: 静置 3s 自动保存
settings_engine_custom: 自定义搜索引擎
