appName: New Tab Pro
appDescription: "Local new tab: Picsum wallpapers, clock, weather, todo, notes, pomodoro with side wings. Zero backend, no tracking."
settings_tab_search: Search
settings_tab_wallpaper: Wallpaper
settings_tab_theme: Theme
settings_tab_home: Home
settings_tab_advanced: Advanced
settings_language_auto: Follow browser
settings_language_desc: Takes effect immediately and is remembered. "Follow browser" matches your system UI language.
settings_title: Settings
settings_close: Close
settings_autosave: Auto-saves 3s after you stop
settings_engine_custom: Custom search engines
settings_engine_name_placeholder: Name, e.g. Zhihu
settings_engine_add: Add
settings_engine_icon_details: Icon for the new engine (optional)
settings_engine_empty: No custom engines yet
settings_engine_favicon: Use the site favicon as icon
settings_engine_site_icon: Site icon
settings_engine_pick_image: Pick an image as icon
settings_engine_change_image: Change
settings_engine_choose_image: Choose
settings_engine_clear_icon: Clear icon, fall back to favicon or initial
settings_engine_clear: Clear
settings_engine_delete: Delete
settings_engine_delete_aria: Delete engine
settings_engine_placeholder_desc: Use %s in the search URL as the keyword placeholder; once added it appears in the search bar dropdown. Custom engines accept a dragged image crop; without one the site favicon is used, then the first character of the name. Built-in engines always use brand icons.
settings_engine_builtin: Built-in engines
settings_weather_city: Weather city
settings_weather_city_placeholder: e.g. Beijing, Shanghai, Guangzhou
settings_weather_city_desc: Leave empty to use your location automatically, or type a city name.
settings_tagline: Home tagline
settings_tagline_placeholder: e.g. Write good code today
settings_tagline_desc: Shown below the clock. Leave empty to hide.
settings_wallpaper_brightness: Brightness
settings_wallpaper_blur: Blur
settings_wallpaper_adjust_desc: Tune the wallpaper for easier reading. Changes apply immediately and save automatically.
settings_wallpaper_source: Wallpaper source
settings_source_picsum: Picsum picks (default)
settings_source_picsum_desc: Reachable directly in mainland China; curated Unsplash photos, no API key needed. Page browsing only — category and keyword filters are unsupported; picking a category tries Wallhaven and falls back to browse mode with a notice if unreachable.
settings_source_wallhaven: Wallhaven (category and keyword filters)
settings_source_wallhaven_desc: The only source that really filters by category and keyword, with high-quality wallpapers; requires access to overseas networks (wallhaven.cc is unstable from mainland China). Choose this if you want category filtering.
settings_wallpaper_source_hint: Takes effect the next time you open the wallpaper library; the startup wallpaper and "Shuffle" also use the selected source.
settings_theme_label: Appearance theme
settings_theme_light: Light
settings_theme_light_desc: "Always as-is: white text over the wallpaper"
settings_theme_dark: Dark
settings_theme_dark_desc: Darkens the wallpaper on top of the base style
settings_theme_system: Follow system
settings_theme_system_desc: Switches with your OS light/dark preference
settings_theme_sun: Sunrise and sunset
settings_theme_sun_desc: Light by day, dark at night
settings_theme_light_start: Day starts
settings_theme_motion_preview: Preview mode — auto-saves 3s after you stop
settings_sun_desc: Sunrise and sunset times are read from your location; if location or network is unavailable, the custom times above are used.
settings_motion: Motion
settings_reduce_motion: Reduce motion
settings_reduce_motion_desc: Disables panel transitions and hover movement to cut visual noise and repaint cost. When your system turns on "Reduce motion" this degrades automatically; no need to enable it here.
settings_widgets: Widgets
settings_widgets_home: Show widgets on the homepage
settings_widgets_desc: To-do, notes and Pomodoro stay on both sides; once off you can still open each panel from the buttons at the top right
settings_side_card_desc: All four cards are shown by default; switch any to "Show when there is content" or "Hidden". Hidden cards give their width back to the centre.
settings_language: Language
settings_pexels_placeholder: Enter your API key
settings_pexels_desc_part1: "Optional enhancement: when set, wallpaper search and category filtering always use Pexels (this takes priority over the \"Wallpaper source\" selection below). Works fine without it — the free Picsum library is the default and needs no key, but Picsum does not support category filtering."
settings_get_free_key: Get a free key
settings_amap_key: Amap (Gaode) Web Service Key (optional)
settings_amap_placeholder: Enter your Amap Web Service key
settings_amap_desc: "Optional: without it, weather uses free Open-Meteo data and needs no key. For Amap data, apply for a Web Service Key on the Amap open platform."
